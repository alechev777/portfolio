<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Регламент обработки инцидентов ИБ: жизненный цикл, 6 контуров">
<defs>
  <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1830"/><stop offset="0.55" stop-color="#0d2444"/><stop offset="1" stop-color="#0a2e4a"/></linearGradient>
  <linearGradient id="hdG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#123052"/><stop offset="1" stop-color="#1d6fe0"/></linearGradient>
  <linearGradient id="stp1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
  <linearGradient id="stpG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#0a8f63"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity=".35"/></filter>
  <marker id="arI" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5fc1ff"/></marker>
</defs>
<rect width="1200" height="620" rx="24" fill="url(#bgG)"/>
<circle cx="1080" cy="50" r="200" fill="oklch(0.7 0.14 250 / .13)"/>
<circle cx="120" cy="560" r="200" fill="oklch(0.7 0.15 190 / .1)"/>

<!-- Header -->
<rect x="0" y="0" width="1200" height="78" rx="24" fill="url(#hdG)"/>
<rect x="0" y="54" width="1200" height="24" fill="url(#hdG)"/>
<text x="40" y="38" font-size="21" font-weight="800" fill="#fff" font-family="Inter,system-ui,sans-serif">Регламент обработки инцидентов ИБ</text>
<text x="40" y="62" font-size="13" fill="#bfd8f0" font-family="Inter,system-ui,sans-serif">ITSM · информационная безопасность · жизненный цикл в 6 контурах</text>
<rect x="960" y="20" width="130" height="40" rx="20" fill="#ffffff" opacity=".14"/>
<text x="1025" y="45" text-anchor="middle" font-size="12" font-weight="800" fill="#bfe9ff" font-family="Inter,system-ui,sans-serif">АРТЕФАКТ</text>

<!-- ===== 6 шагов ===== -->
<g filter="url(#sh)" font-family="Inter,system-ui,sans-serif">
  <!-- 1 -->
  <rect x="30" y="104" width="180" height="150" rx="18" fill="#0f2b4d" stroke="rgba(90,167,255,.4)" stroke-width="1.5"/>
  <circle cx="78" cy="132" r="18" fill="url(#stp1)"/><text x="78" y="138" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">1</text>
  <text x="108" y="138" font-size="16" font-weight="700" fill="#eef4ff">Детектирование</text>
  <text x="48" y="176" font-size="13" fill="#cfe2f7">SIEM · САП · каналы</text>
  <text x="48" y="200" font-size="12" fill="#7ca4cf">обнаружение события</text>
  <text x="48" y="224" font-size="12" fill="#7ca4cf">· первичная оценка</text>
  <!-- 2 -->
  <rect x="230" y="104" width="180" height="150" rx="18" fill="#0f2b4d" stroke="rgba(90,167,255,.4)" stroke-width="1.5"/>
  <circle cx="278" cy="132" r="18" fill="url(#stp1)"/><text x="278" y="138" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">2</text>
  <text x="308" y="138" font-size="16" font-weight="700" fill="#eef4ff">Анализ / триаж</text>
  <text x="248" y="176" font-size="13" fill="#cfe2f7">классификация</text>
  <text x="248" y="200" font-size="12" fill="#7ca4cf">· приоритет</text>
  <text x="248" y="224" font-size="12" fill="#7ca4cf">· вовлечение</text>
  <!-- 3 -->
  <rect x="430" y="104" width="180" height="150" rx="18" fill="#0f2b4d" stroke="rgba(90,167,255,.4)" stroke-width="1.5"/>
  <circle cx="478" cy="132" r="18" fill="url(#stp1)"/><text x="478" y="138" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">3</text>
  <text x="508" y="138" font-size="16" font-weight="700" fill="#eef4ff">Сдерживание</text>
  <text x="448" y="176" font-size="13" fill="#cfe2f7">локализация:</text>
  <text x="448" y="200" font-size="12" fill="#7ca4cf">сеть · сегмент</text>
  <text x="448" y="224" font-size="12" fill="#7ca4cf">· сервис</text>
  <!-- 4 -->
  <rect x="630" y="104" width="180" height="150" rx="18" fill="#0f2b4d" stroke="rgba(90,167,255,.4)" stroke-width="1.5"/>
  <circle cx="678" cy="132" r="18" fill="url(#stp1)"/><text x="678" y="138" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">4</text>
  <text x="708" y="138" font-size="16" font-weight="700" fill="#eef4ff">Устранение</text>
  <text x="648" y="176" font-size="13" fill="#cfe2f7">ВПО · доступ</text>
  <text x="648" y="200" font-size="12" fill="#7ca4cf">· патчи</text>
  <text x="648" y="224" font-size="12" fill="#7ca4cf">· митигация</text>
  <!-- 5 -->
  <rect x="830" y="104" width="180" height="150" rx="18" fill="#0f2b4d" stroke="rgba(90,167,255,.4)" stroke-width="1.5"/>
  <circle cx="878" cy="132" r="18" fill="url(#stp1)"/><text x="878" y="138" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">5</text>
  <text x="908" y="138" font-size="16" font-weight="700" fill="#eef4ff">Восстановление</text>
  <text x="848" y="176" font-size="13" fill="#cfe2f7">контроль · возврат</text>
  <text x="848" y="200" font-size="12" fill="#7ca4cf">бизнес-процессов</text>
  <text x="848" y="224" font-size="12" fill="#7ca4cf">· проверка</text>
  <!-- 6 -->
  <rect x="1030" y="104" width="150" height="150" rx="18" fill="#0d3a2c" stroke="rgba(63,224,160,.45)" stroke-width="1.5"/>
  <circle cx="1078" cy="132" r="18" fill="url(#stpG)"/><text x="1078" y="138" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">6</text>
  <text x="1085" y="140" font-size="16" font-weight="700" fill="#d8fff0">Пост-инцидент</text>
  <text x="1048" y="176" font-size="13" fill="#a7ecd0">уроки · БЗ</text>
  <text x="1048" y="200" font-size="12" fill="#6fc4a3">· отчёт ·</text>
  <text x="1048" y="224" font-size="12" fill="#6fc4a3">разбор</text>
</g>
<!-- стрелки между шагами -->
<g stroke="#5fc1ff" stroke-width="2.5" fill="none">
  <line x1="210" y1="179" x2="228" y2="179" marker-end="url(#arI)"/>
  <line x1="410" y1="179" x2="428" y2="179" marker-end="url(#arI)"/>
  <line x1="610" y1="179" x2="628" y2="179" marker-end="url(#arI)"/>
  <line x1="810" y1="179" x2="828" y2="179" marker-end="url(#arI)"/>
  <line x1="1010" y1="179" x2="1028" y2="179" marker-end="url(#arI)"/>
</g>

<!-- ===== Приоритизация ===== -->
<g filter="url(#sh)" font-family="Inter,system-ui,sans-serif">
  <rect x="30" y="280" width="560" height="96" rx="18" fill="#0f2b4d" stroke="rgba(90,167,255,.3)"/>
  <text x="52" y="312" font-size="14" font-weight="700" fill="#eef4ff">Приоритизация — влияние × срочность</text>
  <rect x="52" y="326" width="118" height="34" rx="16" fill="#6b1f26"/><text x="111" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#ffcfd4">Критический</text>
  <rect x="180" y="326" width="104" height="34" rx="16" fill="#7a4a12"/><text x="232" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#ffe4b8">Высокий</text>
  <rect x="294" y="326" width="104" height="34" rx="16" fill="#1d3f88"/><text x="346" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#bcd4ff">Средний</text>
  <rect x="408" y="326" width="96" height="34" rx="16" fill="#223048"/><text x="456" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#cbd6e6">Низкий</text>
  <rect x="610" y="280" width="560" height="96" rx="18" fill="#0f2b4d" stroke="rgba(90,167,255,.3)"/>
  <text x="632" y="312" font-size="14" font-weight="700" fill="#eef4ff">Классификация события</text>
  <text x="632" y="338" font-size="12.5" fill="#cfe2f7">конфиденциальность · целостность · доступность</text>
  <text x="632" y="360" font-size="12.5" fill="#cfe2f7">источник · умысел · масштаб воздействия</text>
</g>

<!-- ===== RACI ===== -->
<g filter="url(#sh)" font-family="Inter,system-ui,sans-serif">
  <rect x="30" y="394" width="560" height="96" rx="18" fill="#0f2b4d" stroke="rgba(90,167,255,.3)"/>
  <text x="52" y="424" font-size="14" font-weight="700" fill="#eef4ff">Роли и RACI</text>
  <text x="52" y="452" font-size="12.5" fill="#cfe2f7">Владелец · Менеджер процесса</text>
  <text x="52" y="474" font-size="12.5" fill="#cfe2f7">Сервис-менеджер · РРГ</text>
  <rect x="610" y="394" width="560" height="96" rx="18" fill="#0f3b33" stroke="rgba(79,209,197,.4)"/>
  <text x="632" y="424" font-size="14" font-weight="700" fill="#eafaf9">Специалисты линий</text>
  <text x="632" y="452" font-size="12.5" fill="#cfe2f7">1 / 1,5 / 2 / 3 линия · администратор ИБ</text>
  <text x="632" y="474" font-size="12.5" fill="#cfe2f7">координаторы изменений и проблем</text>
</g>

<!-- ===== 6 контуров ===== -->
<g filter="url(#sh)">
  <rect x="30" y="510" width="1140" height="88" rx="18" fill="#0d2444" stroke="rgba(79,209,197,.4)" stroke-width="1.5"/>
  <circle cx="84" cy="554" r="14" fill="#4fd1c5"/><text x="84" y="559" text-anchor="middle" font-size="13" font-weight="800" fill="#06212e" font-family="Inter,system-ui,sans-serif">6</text>
  <text x="116" y="548" font-size="17" font-weight="700" fill="#eafaf9" font-family="Inter,system-ui,sans-serif">контуров реагирования</text>
  <text x="116" y="572" font-size="13" fill="#8fd3e0" font-family="Inter,system-ui,sans-serif">от детектирования до пост-инцидента · сквозной SLA по всему контуру</text>
</g>
</svg>