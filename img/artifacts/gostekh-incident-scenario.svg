<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" role="img" aria-label="Сценарий реагирования на аварийные инциденты">
  <rect width="920" height="400" fill="#F8FAFC"/>
  <rect x="0" y="0" width="920" height="58" fill="#123052"/>
  <text x="40" y="37" font-size="19" font-weight="800" fill="#fff">Сценарий реагирования на аварийные инциденты</text>
  <text x="880" y="37" text-anchor="end" font-size="12" font-weight="700" fill="#8fb3d9">Major Incident Management</text>
  <!-- 4 карточки -->
  <g font-size="12" fill="#123052">
    <!-- 1 Маршрутная карта -->
    <rect x="25" y="80" width="210" height="220" rx="14" fill="#fff" stroke="#2563EB" stroke-width="2"/>
    <rect x="25" y="80" width="210" height="40" rx="14" fill="#2563EB"/><rect x="25" y="100" width="210" height="20" fill="#2563EB"/>
    <text x="130" y="99" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">1 · Маршрутная карта</text>
    <g font-size="11.2" fill="#374151">
      <text x="40" y="140">• Интеграция с AD / порталом</text>
      <text x="40" y="160">• Карточки контактов вендоров</text>
      <text x="40" y="180">• Ответственные по Сервису/КЕ</text>
      <text x="40" y="200">• Часовые пояса и графики</text>
      <text x="40" y="220">• Уровни эскалации (до часов)</text>
      <text x="40" y="240">• Календарь ответственных</text>
    </g>
    <!-- 2 Единое окно -->
    <rect x="245" y="80" width="210" height="220" rx="14" fill="#fff" stroke="#2563EB" stroke-width="2"/>
    <rect x="245" y="80" width="210" height="40" rx="14" fill="#2563EB"/><rect x="245" y="100" width="210" height="20" fill="#2563EB"/>
    <text x="350" y="99" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">2 · Единое окно</text>
    <g font-size="11.2" fill="#374151">
      <text x="260" y="140">• Автоуведомление дежурного</text>
      <text x="260" y="160">• Регистрация аварии</text>
      <text x="260" y="180">• Автосоздание чата в Telegram</text>
      <text x="260" y="200">• Подключение сервис-менеджера</text>
      <text x="260" y="220">• Календарь работ по Сервису</text>
      <text x="260" y="240">• Индикация аварийных работ</text>
    </g>
    <!-- 3 Светофор -->
    <rect x="465" y="80" width="215" height="220" rx="14" fill="#fff" stroke="#F59E0B" stroke-width="2"/>
    <rect x="465" y="80" width="215" height="40" rx="14" fill="#F59E0B"/><rect x="465" y="100" width="215" height="20" fill="#F59E0B"/>
    <text x="572" y="99" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">3 · Светофор аварий</text>
    <g font-size="11.2" fill="#374151">
      <text x="480" y="140">• Карточка аварии (№, приоритет)</text>
      <text x="480" y="160">• Счётчик SLA</text>
      <text x="480" y="180">• Гипотезы → Telegram</text>
      <text x="480" y="200">• Светофор доступности</text>
      <text x="480" y="220">• Автопрозвон голосовым</text>
      <text x="480" y="240">• Аварийное оповещение</text>
    </g>
    <!-- 4 Трудозатраты -->
    <rect x="690" y="80" width="205" height="220" rx="14" fill="#fff" stroke="#10B981" stroke-width="2"/>
    <rect x="690" y="80" width="205" height="40" rx="14" fill="#10B981"/><rect x="690" y="100" width="205" height="20" fill="#10B981"/>
    <text x="792" y="99" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">4 · Трудозатраты</text>
    <g font-size="11.2" fill="#374151">
      <text x="705" y="140">• Консолидация трудозатрат</text>
      <text x="705" y="160">• Синхронизация из тикет-систем</text>
      <text x="705" y="180">• Данные об отсутствиях</text>
      <text x="705" y="200">• Согласование с руководителем</text>
      <text x="705" y="220">• Отчётность: план vs факт</text>
      <text x="705" y="240">• Для бухгалтерии</text>
    </g>
  </g>
  <!-- нижняя строка -->
  <rect x="25" y="315" width="870" height="64" rx="14" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="50" y="343" font-size="12.5" font-weight="800" fill="#123052">Результат</text>
  <text x="50" y="363" font-size="11.5" fill="#475569">Сквозной контур управления авариями: карта контактов → «единое окно» → светофор статуса → учёт трудозатрат. Все аварии — в одном окне, с SLA и автопрозвоном.</text>
</svg>