<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Сценарий реагирования на аварийные инциденты">
<defs>
  <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1830"/><stop offset="0.55" stop-color="#0d2444"/><stop offset="1" stop-color="#0a2e4a"/></linearGradient>
  <linearGradient id="hdG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#123052"/><stop offset="1" stop-color="#1d6fe0"/></linearGradient>
  <linearGradient id="c1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
  <linearGradient id="c2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0ea5a0"/><stop offset="1" stop-color="#0c8a87"/></linearGradient>
  <linearGradient id="c3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#d9830a"/></linearGradient>
  <linearGradient id="c4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#0a8f63"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity=".35"/></filter>
</defs>
<rect width="1200" height="600" rx="24" fill="url(#bgG)"/>
<circle cx="1080" cy="50" r="200" fill="oklch(0.7 0.14 250 / .13)"/>
<circle cx="120" cy="540" r="190" fill="oklch(0.7 0.15 190 / .1)"/>

<rect x="0" y="0" width="1200" height="78" rx="24" fill="url(#hdG)"/><rect x="0" y="54" width="1200" height="24" fill="url(#hdG)"/>
<text x="40" y="38" font-size="21" font-weight="800" fill="#fff" font-family="Inter,system-ui,sans-serif">Сценарий реагирования на аварийные инциденты</text>
<text x="40" y="62" font-size="13" fill="#bfd8f0" font-family="Inter,system-ui,sans-serif">Major Incident Management · сквозной контур управления авариями</text>
<rect x="960" y="20" width="130" height="40" rx="20" fill="#ffffff" opacity=".14"/>
<text x="1025" y="45" text-anchor="middle" font-size="12" font-weight="800" fill="#bfe9ff" font-family="Inter,system-ui,sans-serif">АРТЕФАКТ</text>

<!-- ===== 4 карточки ===== -->
<g filter="url(#sh)" font-family="Inter,system-ui,sans-serif">
  <!-- 1 -->
  <rect x="30" y="102" width="272" height="300" rx="20" fill="#0f2b4d" stroke="rgba(90,167,255,.4)" stroke-width="1.5"/>
  <rect x="30" y="102" width="272" height="54" rx="20" fill="url(#c1)"/>
  <circle cx="60" cy="129" r="15" fill="#fff" opacity=".2"/><text x="60" y="134" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text>
  <text x="86" y="134" font-size="15" font-weight="700" fill="#fff">Маршрутная карта</text>
  <g font-size="12.5" fill="#cfe2f7">
    <text x="48" y="190">• Интеграция с AD / порталом</text>
    <text x="48" y="220">• Карточки контактов вендоров</text>
    <text x="48" y="250">• Ответственные по Сервису/КЕ</text>
    <text x="48" y="280">• Часовые пояса и графики</text>
    <text x="48" y="310">• Уровни эскалации (до часов)</text>
    <text x="48" y="340">• Календарь ответственных</text>
  </g>
  <!-- 2 -->
  <rect x="322" y="102" width="272" height="300" rx="20" fill="#0f2b4d" stroke="rgba(79,209,197,.4)" stroke-width="1.5"/>
  <rect x="322" y="102" width="272" height="54" rx="20" fill="url(#c2)"/>
  <circle cx="352" cy="129" r="15" fill="#fff" opacity=".2"/><text x="352" y="134" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text>
  <text x="378" y="134" font-size="15" font-weight="700" fill="#fff">Единое окно</text>
  <g font-size="12.5" fill="#cfe2f7">
    <text x="340" y="190">• Автоуведомление дежурного</text>
    <text x="340" y="220">• Регистрация аварии</text>
    <text x="340" y="250">• Автосоздание чата в Telegram</text>
    <text x="340" y="280">• Подключение сервис-менеджера</text>
    <text x="340" y="310">• Календарь работ по Сервису</text>
    <text x="340" y="340">• Индикация аварийных работ</text>
  </g>
  <!-- 3 -->
  <rect x="614" y="102" width="272" height="300" rx="20" fill="#0f2b4d" stroke="rgba(255,196,90,.4)" stroke-width="1.5"/>
  <rect x="614" y="102" width="272" height="54" rx="20" fill="url(#c3)"/>
  <circle cx="644" cy="129" r="15" fill="#fff" opacity=".2"/><text x="644" y="134" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3</text>
  <text x="670" y="134" font-size="15" font-weight="700" fill="#fff">Светофор аварий</text>
  <g font-size="12.5" fill="#cfe2f7">
    <text x="632" y="190">• Карточка аварии (№, приоритет)</text>
    <text x="632" y="220">• Счётчик SLA</text>
    <text x="632" y="250">• Гипотезы → Telegram</text>
    <text x="632" y="280">• Светофор доступности</text>
    <text x="632" y="310">• Автопрозвон голосовым</text>
    <text x="632" y="340">• Аварийное оповещение</text>
  </g>
  <!-- 4 -->
  <rect x="906" y="102" width="264" height="300" rx="20" fill="#0d3a2c" stroke="rgba(63,224,160,.45)" stroke-width="1.5"/>
  <rect x="906" y="102" width="264" height="54" rx="20" fill="url(#c4)"/>
  <circle cx="936" cy="129" r="15" fill="#fff" opacity=".2"/><text x="936" y="134" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">4</text>
  <text x="962" y="134" font-size="15" font-weight="700" fill="#fff">Трудозатраты</text>
  <g font-size="12.5" fill="#cfe2f7">
    <text x="924" y="190">• Консолидация трудозатрат</text>
    <text x="924" y="220">• Синхронизация из тикет-систем</text>
    <text x="924" y="250">• Данные об отсутствиях</text>
    <text x="924" y="280">• Согласование с руководителем</text>
    <text x="924" y="310">• Отчётность: план vs факт</text>
    <text x="924" y="340">• Для бухгалтерии</text>
  </g>
</g>

<!-- ===== Результат ===== -->
<g filter="url(#sh)">
  <rect x="30" y="424" width="1140" height="150" rx="20" fill="#0d2444" stroke="rgba(79,209,197,.4)" stroke-width="1.5"/>
  <text x="60" y="470" font-size="15" font-weight="700" fill="#eafaf9" font-family="Inter,system-ui,sans-serif">Результат</text>
  <text x="60" y="502" font-size="13.5" fill="#cfe2f7" font-family="Inter,system-ui,sans-serif">Сквозной контур управления авариями: карта контактов → «единое окно» → светофор статуса → учёт трудозатрат.</text>
  <rect x="60" y="524" width="240" height="32" rx="16" fill="#0e3a30"/><text x="180" y="545" text-anchor="middle" font-size="12" font-weight="700" fill="#7dffcf" font-family="Inter,system-ui,sans-serif">все аварии в одном окне</text>
  <rect x="312" y="524" width="190" height="32" rx="16" fill="#0e3a30"/><text x="407" y="545" text-anchor="middle" font-size="12" font-weight="700" fill="#7dffcf" font-family="Inter,system-ui,sans-serif">с SLA и автопрозвоном</text>
  <rect x="514" y="524" width="220" height="32" rx="16" fill="#0e3a30"/><text x="624" y="545" text-anchor="middle" font-size="12" font-weight="700" fill="#7dffcf" font-family="Inter,system-ui,sans-serif">единый учёт и отчётность</text>
</g>
</svg>