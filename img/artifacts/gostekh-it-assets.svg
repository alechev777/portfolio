<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Регламент учёта ИТ-активов: жизненный цикл">
<defs>
  <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1830"/><stop offset="0.55" stop-color="#0d2444"/><stop offset="1" stop-color="#0a2e4a"/></linearGradient>
  <linearGradient id="hdG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#123052"/><stop offset="1" stop-color="#1d6fe0"/></linearGradient>
  <linearGradient id="stpB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
  <linearGradient id="stpA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#0a8f63"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity=".35"/></filter>
  <marker id="arA" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5fc1ff"/></marker>
</defs>
<rect width="1200" height="600" rx="24" fill="url(#bgG)"/>
<circle cx="1080" cy="50" r="200" fill="oklch(0.7 0.14 250 / .13)"/>
<circle cx="120" cy="540" r="190" fill="oklch(0.7 0.15 190 / .1)"/>

<rect x="0" y="0" width="1200" height="78" rx="24" fill="url(#hdG)"/><rect x="0" y="54" width="1200" height="24" fill="url(#hdG)"/>
<text x="40" y="38" font-size="21" font-weight="800" fill="#fff" font-family="Inter,system-ui,sans-serif">Регламент учёта ИТ-активов</text>
<text x="40" y="62" font-size="13" fill="#bfd8f0" font-family="Inter,system-ui,sans-serif">ITAM · SACM/CMDB · полный жизненный цикл актива</text>
<rect x="960" y="20" width="130" height="40" rx="20" fill="#ffffff" opacity=".14"/>
<text x="1025" y="45" text-anchor="middle" font-size="12" font-weight="800" fill="#bfe9ff" font-family="Inter,system-ui,sans-serif">АРТЕФАКТ</text>

<!-- ===== 5 этапов ===== -->
<g filter="url(#sh)" font-family="Inter,system-ui,sans-serif">
  <rect x="30" y="104" width="210" height="180" rx="18" fill="#0f2b4d" stroke="rgba(90,167,255,.4)" stroke-width="1.5"/>
  <rect x="30" y="104" width="210" height="46" rx="18" fill="url(#stpB)"/>
  <text x="45" y="134" font-size="15" font-weight="800" fill="#fff">1 · Приёмка</text>
  <text x="48" y="182" font-size="13" fill="#cfe2f7">проверка по спецификации</text>
  <text x="48" y="208" font-size="12.5" fill="#7ca4cf">соответствие / несоответствие</text>
  <text x="48" y="234" font-size="12.5" fill="#7ca4cf">первичный осмотр</text>
  <rect x="48" y="252" width="64" height="22" rx="11" fill="#1d3f88"/><text x="80" y="268" text-anchor="middle" font-size="11" fill="#bcd4ff">SACM</text>

  <rect x="260" y="104" width="210" height="180" rx="18" fill="#0f2b4d" stroke="rgba(90,167,255,.4)" stroke-width="1.5"/>
  <rect x="260" y="104" width="210" height="46" rx="18" fill="url(#stpB)"/>
  <text x="275" y="134" font-size="15" font-weight="800" fill="#fff">2 · Учёт</text>
  <text x="278" y="182" font-size="13" fill="#cfe2f7">регистрация + маркировка</text>
  <text x="278" y="208" font-size="12.5" fill="#7ca4cf">универсальный идентификатор</text>
  <text x="278" y="234" font-size="12.5" fill="#7ca4cf">партии расходников</text>
  <rect x="278" y="252" width="90" height="22" rx="11" fill="#1d3f88"/><text x="323" y="268" text-anchor="middle" font-size="11" fill="#bcd4ff">CMDB</text>

  <rect x="490" y="104" width="210" height="180" rx="18" fill="#0f2b4d" stroke="rgba(90,167,255,.4)" stroke-width="1.5"/>
  <rect x="490" y="104" width="210" height="46" rx="18" fill="url(#stpB)"/>
  <text x="505" y="134" font-size="15" font-weight="800" fill="#fff">3 · Эксплуатация</text>
  <text x="508" y="182" font-size="13" fill="#cfe2f7">выдача · перемещение · ремонт</text>
  <text x="508" y="208" font-size="12.5" fill="#7ca4cf">закрепление за МОЛ</text>
  <text x="508" y="234" font-size="12.5" fill="#7ca4cf">статусы и ответственность</text>
  <rect x="508" y="252" width="80" height="22" rx="11" fill="#1d3f88"/><text x="548" y="268" text-anchor="middle" font-size="11" fill="#bcd4ff">МОЛ</text>

  <rect x="720" y="104" width="220" height="180" rx="18" fill="#0f2b4d" stroke="rgba(90,167,255,.4)" stroke-width="1.5"/>
  <rect x="720" y="104" width="220" height="46" rx="18" fill="url(#stpB)"/>
  <text x="735" y="134" font-size="15" font-weight="800" fill="#fff">4 · Инвентаризация</text>
  <text x="738" y="182" font-size="13" fill="#cfe2f7">сличительная ведомость</text>
  <text x="738" y="208" font-size="12.5" fill="#7ca4cf">сверка · расхождения</text>
  <text x="738" y="234" font-size="12.5" fill="#7ca4cf">корректировка учёта</text>
  <rect x="738" y="252" width="92" height="22" rx="11" fill="#1d3f88"/><text x="784" y="268" text-anchor="middle" font-size="11" fill="#bcd4ff">план-факт</text>

  <rect x="960" y="104" width="210" height="180" rx="18" fill="#0d3a2c" stroke="rgba(63,224,160,.45)" stroke-width="1.5"/>
  <rect x="960" y="104" width="210" height="46" rx="18" fill="url(#stpA)"/>
  <text x="975" y="134" font-size="15" font-weight="800" fill="#fff">5 · Выбытие</text>
  <text x="978" y="182" font-size="13" fill="#a7ecd0">план выбытия · списание</text>
  <text x="978" y="208" font-size="12.5" fill="#6fc4a3">контроль закрытия</text>
  <text x="978" y="234" font-size="12.5" fill="#6fc4a3">утилизация / передача</text>
  <rect x="978" y="252" width="96" height="22" rx="11" fill="#0d4a38"/><text x="1026" y="268" text-anchor="middle" font-size="11" fill="#a7ecd0">закрытие</text>
</g>
<!-- стрелки -->
<g stroke="#5fc1ff" stroke-width="2.5" fill="none">
  <line x1="240" y1="194" x2="258" y2="194" marker-end="url(#arA)"/>
  <line x1="470" y1="194" x2="488" y2="194" marker-end="url(#arA)"/>
  <line x1="700" y1="194" x2="718" y2="194" marker-end="url(#arA)"/>
  <line x1="940" y1="194" x2="958" y2="194" marker-end="url(#arA)"/>
</g>

<!-- ===== Роли ===== -->
<g filter="url(#sh)" font-family="Inter,system-ui,sans-serif">
  <rect x="30" y="304" width="580" height="130" rx="18" fill="#0f2b4d" stroke="rgba(90,167,255,.3)"/>
  <text x="52" y="336" font-size="14" font-weight="700" fill="#eef4ff">Роли (RACI)</text>
  <text x="52" y="364" font-size="12.5" fill="#cfe2f7">Ответственный за приёмку · Специалист по учёту</text>
  <text x="52" y="388" font-size="12.5" fill="#cfe2f7">Ответственный за выдачу · Менеджер по ИТ-активам</text>
  <text x="52" y="412" font-size="12.5" fill="#cfe2f7">Комиссия по инвентаризации · МОЛ</text>
</g>
<g filter="url(#sh)" font-family="Inter,system-ui,sans-serif">
  <rect x="630" y="304" width="540" height="130" rx="18" fill="#0f2b4d" stroke="rgba(90,167,255,.3)"/>
  <text x="652" y="336" font-size="14" font-weight="700" fill="#eef4ff">Принципы</text>
  <text x="652" y="364" font-size="12.5" fill="#cfe2f7">• Универсальный идентификатор каждого актива</text>
  <text x="652" y="388" font-size="12.5" fill="#cfe2f7">• Привязка к МОЛ и ответственному инициатору</text>
  <text x="652" y="412" font-size="12.5" fill="#cfe2f7">• Ремонт → возврат или план выбытия · сверка по ведомости</text>
</g>

<!-- ===== Итог ===== -->
<g filter="url(#sh)">
  <rect x="30" y="460" width="1140" height="108" rx="18" fill="#0d2444" stroke="rgba(79,209,197,.4)" stroke-width="1.5"/>
  <circle cx="86" cy="514" r="16" fill="#4fd1c5"/><text x="86" y="520" text-anchor="middle" font-size="14" font-weight="800" fill="#06212e" font-family="Inter,system-ui,sans-serif">5</text>
  <text x="118" y="506" font-size="17" font-weight="700" fill="#eafaf9" font-family="Inter,system-ui,sans-serif">этапов жизненного цикла актива</text>
  <text x="118" y="532" font-size="13" fill="#8fd3e0" font-family="Inter,system-ui,sans-serif">приёмка → учёт → эксплуатация → инвентаризация → выбытие</text>
  <text x="118" y="553" font-size="12" fill="#6fb4c8" font-family="Inter,system-ui,sans-serif">каждый актив — с идентификатором, МОЛ и прослеживаемостью</text>
</g>
</svg>