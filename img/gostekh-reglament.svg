<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Регламент информационного взаимодействия: СРО ГосТех ЕЦП и ФГИС СЦ Минцифры">
<defs>
  <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a1830"/><stop offset="0.55" stop-color="#0d2444"/><stop offset="1" stop-color="#0a2e4a"/>
  </linearGradient>
  <linearGradient id="hdG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#123052"/><stop offset="1" stop-color="#1d6fe0"/>
  </linearGradient>
  <linearGradient id="glasA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d6fe0" stop-opacity=".28"/><stop offset="1" stop-color="#1d6fe0" stop-opacity=".06"/></linearGradient>
  <linearGradient id="glasB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0ea5a0" stop-opacity=".3"/><stop offset="1" stop-color="#0ea5a0" stop-opacity=".05"/></linearGradient>
  <linearGradient id="chipA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
  <linearGradient id="chipCyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0ea5a0"/><stop offset="1" stop-color="#0d8a88"/></linearGradient>
  <linearGradient id="chipTeal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e7490"/><stop offset="1" stop-color="#0b5a70"/></linearGradient>
  <linearGradient id="chipGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f9d6b"/><stop offset="1" stop-color="#1a8058"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
  <filter id="glowB" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/></filter>
  <marker id="arA" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#5aa7ff"/></marker>
  <marker id="arC" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#4fd1c5"/></marker>
</defs>

<rect width="1200" height="640" rx="24" fill="url(#bgG)"/>
<circle cx="1040" cy="60" r="200" fill="oklch(0.7 0.14 250 / .14)" />
<circle cx="160" cy="560" r="220" fill="oklch(0.7 0.15 190 / .1)" />

<!-- Header -->
<rect x="0" y="0" width="1200" height="84" rx="24" fill="url(#hdG)"/>
<rect x="0" y="60" width="1200" height="24" fill="url(#hdG)"/>
<text x="40" y="40" font-size="21" font-weight="800" fill="#ffffff" font-family="Inter,system-ui,sans-serif">Регламент информационного взаимодействия</text>
<text x="40" y="64" font-size="13" fill="#bfd8f0" font-family="Inter,system-ui,sans-serif">СРО «ГосТех» (ЕЦП) ↔ ФГИС «Ситуационный центр» Минцифры · уровень министерства · 2025</text>
<rect x="880" y="22" width="120" height="40" rx="20" fill="#ffffff" opacity=".14"/>
<text x="940" y="47" text-anchor="middle" font-size="12" font-weight="800" fill="#bfe9ff" font-family="Inter,system-ui,sans-serif">АРТЕФАКТ</text>

<!-- ===== ECP card ===== -->
<g filter="url(#shadow)">
  <rect x="32" y="106" width="470" height="218" rx="22" fill="url(#glasA)" stroke="rgba(90,167,255,.4)" stroke-width="1.5"/>
  <circle cx="56" cy="126" r="16" fill="url(#chipA)"/>
  <text x="56" y="131" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" font-family="Inter,system-ui,sans-serif">ЕЦП</text>
  <text x="86" y="132" font-size="17" font-weight="700" fill="#eef4ff" font-family="Inter,system-ui,sans-serif">СРО «ГосТех» — Единая платформа</text>
  <g font-family="Inter,system-ui,sans-serif">
    <circle cx="58" cy="168" r="5" fill="#5aa7ff"/><text x="74" y="173" font-size="13.5" fill="#cfe2f7">Регистрация и классификация обращений</text>
    <circle cx="58" cy="200" r="5" fill="#5aa7ff"/><text x="74" y="205" font-size="13.5" fill="#cfe2f7">SLA-расчёт по приоритетам</text>
    <circle cx="58" cy="232" r="5" fill="#5aa7ff"/><text x="74" y="237" font-size="13.5" fill="#cfe2f7">REST-адаптер СРО (отправка данных)</text>
    <circle cx="58" cy="264" r="5" fill="#5aa7ff"/><text x="74" y="269" font-size="13.5" fill="#cfe2f7">Каналы: телефон, e-mail, ЛК</text>
  </g>
</g>

<!-- ===== REST connector ===== -->
<g filter="url(#shadow)">
  <rect x="520" y="166" width="88" height="64" rx="16" fill="#112b4a" stroke="#5aa7ff" stroke-width="1.5"/>
  <rect x="520" y="166" width="88" height="64" rx="16" fill="url(#glasA)" opacity=".8"/>
  <text x="564" y="196" text-anchor="middle" font-size="13" font-weight="800" fill="#7cc0ff" font-family="Inter,system-ui,sans-serif">REST</text>
  <text x="564" y="214" text-anchor="middle" font-size="11" fill="#8fb3d9" font-family="Inter,system-ui,sans-serif">адаптер</text>
</g>
<line x1="506" y1="196" x2="518" y2="196" stroke="#5aa7ff" stroke-width="2.5" marker-end="url(#arA)"/>
<line x1="610" y1="196" x2="622" y2="196" stroke="#5aa7ff" stroke-width="2.5" marker-end="url(#arA)"/>

<!-- ===== SZ Vostok card ===== -->
<g filter="url(#shadow)">
  <rect x="626" y="106" width="470" height="218" rx="22" fill="url(#glasB)" stroke="rgba(79,209,197,.4)" stroke-width="1.5"/>
  <circle cx="650" cy="126" r="16" fill="url(#chipCyan)"/>
  <text x="650" y="131" text-anchor="middle" font-size="12" font-weight="800" fill="#06212e" font-family="Inter,system-ui,sans-serif">ФГИС</text>
  <text x="678" y="132" font-size="17" font-weight="700" fill="#eafaf9" font-family="Inter,system-ui,sans-serif">ФГИС «Ситуационный центр» — Восход</text>
  <g font-family="Inter,system-ui,sans-serif">
    <circle cx="652" cy="168" r="5" fill="#4fd1c5"/><text x="668" y="173" font-size="13.5" fill="#d1f2ee">ЛК СЦ — портал подачи обращений</text>
    <circle cx="652" cy="200" r="5" fill="#4fd1c5"/><text x="668" y="205" font-size="13.5" fill="#d1f2ee">Классификация и консультации</text>
    <circle cx="652" cy="232" r="5" fill="#4fd1c5"/><text x="668" y="237" font-size="13.5" fill="#d1f2ee">REST-адаптер ФГИС СЦ</text>
    <circle cx="652" cy="264" r="5" fill="#4fd1c5"/><text x="668" y="269" font-size="13.5" fill="#d1f2ee">Резерв: e-mail sd@sc.digital.gov.ru</text>
  </g>
</g>

<!-- ===== Zond monitor ===== -->
<g filter="url(#shadow)">
  <rect x="32" y="344" width="470" height="70" rx="16" fill="#10294a" stroke="rgba(79,209,197,.4)" stroke-width="1.2"/>
  <circle cx="56" cy="379" r="7" fill="#4fd1c5"/><circle cx="56" cy="379" r="11" fill="none" stroke="#4fd1c5" stroke-width="1" opacity=".4"/>
  <text x="78" y="372" font-size="14" font-weight="700" fill="#eafaf9" font-family="Inter,system-ui,sans-serif">Зонд-система мониторинга</text>
  <text x="78" y="394" font-size="12" fill="#8fd3e0" font-family="Inter,system-ui,sans-serif">порог ответа СИВ &lt; 60 сек · уведомление дежурного инженера</text>
</g>

<!-- ===== Incident rules ===== -->
<g filter="url(#shadow)">
  <rect x="626" y="344" width="470" height="70" rx="16" fill="#10294a" stroke="rgba(90,167,255,.4)" stroke-width="1.2"/>
  <circle cx="650" cy="379" r="7" fill="#5aa7ff"/>
  <text x="672" y="372" font-size="14" font-weight="700" fill="#eef4ff" font-family="Inter,system-ui,sans-serif">6 правил идентификации инцидентов обмена</text>
  <text x="672" y="394" font-size="12" fill="#a8c6e8" font-family="Inter,system-ui,sans-serif">нет ответа 60с · вложения · дубли · метаданные · спецсимволы</text>
</g>

<!-- ===== Lifecycle ===== -->
<text x="40" y="460" font-size="15" font-weight="800" fill="#dbe9f8" font-family="Inter,system-ui,sans-serif">Жизненный цикл обращения</text>
<g filter="url(#shadow)" font-family="Inter,system-ui,sans-serif">
  <rect x="40" y="474" width="166" height="48" rx="14" fill="url(#chipA)"/><text x="123" y="503" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Регистрация</text>
  <rect x="230" y="474" width="166" height="48" rx="14" fill="url(#chipCyan)"/><text x="313" y="503" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Классификация</text>
  <rect x="420" y="474" width="166" height="48" rx="14" fill="url(#chipTeal)"/><text x="503" y="503" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Передача СИВ</text>
  <rect x="610" y="474" width="166" height="48" rx="14" fill="url(#chipGreen)"/><text x="693" y="503" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Решение</text>
  <rect x="800" y="474" width="166" height="48" rx="14" fill="url(#chipA)"/><text x="883" y="503" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Закрытие</text>
  <line x1="206" y1="498" x2="228" y2="498" stroke="#5aa7ff" stroke-width="2.5" marker-end="url(#arA)"/>
  <line x1="396" y1="498" x2="418" y2="498" stroke="#4fd1c5" stroke-width="2.5" marker-end="url(#arC)"/>
  <line x1="586" y1="498" x2="608" y2="498" stroke="#4fd1c5" stroke-width="2.5" marker-end="url(#arC)"/>
  <line x1="776" y1="498" x2="798" y2="498" stroke="#3fe0a0" stroke-width="2.5" marker-end="url(#arA)"/>
</g>

<!-- ===== Key metrics ===== -->
<g font-family="Inter,system-ui,sans-serif">
  <rect x="40" y="546" width="150" height="66" rx="16" fill="#0f2b4d" stroke="rgba(90,167,255,.35)"/><text x="115" y="578" text-anchor="middle" font-size="30" font-weight="900" fill="#7cc0ff">11</text><text x="115" y="600" text-anchor="middle" font-size="11" fill="#a8c6e8">ролей процесса</text>
  <rect x="210" y="546" width="150" height="66" rx="16" fill="#0f2b4d" stroke="rgba(79,209,197,.35)"/><text x="285" y="578" text-anchor="middle" font-size="30" font-weight="900" fill="#4fd1c5">3</text><text x="285" y="600" text-anchor="middle" font-size="11" fill="#a8c6e8">процедуры</text>
  <rect x="380" y="546" width="150" height="66" rx="16" fill="#0f2b4d" stroke="rgba(79,209,197,.35)"/><text x="455" y="578" text-anchor="middle" font-size="30" font-weight="900" fill="#4fd1c5">6</text><text x="455" y="600" text-anchor="middle" font-size="11" fill="#a8c6e8">правил инцидентов</text>
  <rect x="550" y="546" width="180" height="66" rx="16" fill="#0f2b4d" stroke="rgba(90,167,255,.5)"/><text x="640" y="578" text-anchor="middle" font-size="26" font-weight="900" fill="#7cc0ff">SLA 5 мин</text><text x="640" y="600" text-anchor="middle" font-size="11" fill="#a8c6e8">обновление ЛК</text>
  <rect x="750" y="546" width="180" height="66" rx="16" fill="#0f2b4d" stroke="rgba(79,209,197,.5)"/><text x="840" y="578" text-anchor="middle" font-size="26" font-weight="900" fill="#4fd1c5">&lt; 60 сек</text><text x="840" y="600" text-anchor="middle" font-size="11" fill="#a8c6e8">порог ответа СИВ</text>
  <rect x="950" y="546" width="180" height="66" rx="16" fill="#0f2b4d" stroke="rgba(255,196,90,.4)"/><text x="1040" y="578" text-anchor="middle" font-size="26" font-weight="900" fill="#ffd98a">72 часа</text><text x="1040" y="600" text-anchor="middle" font-size="11" fill="#a8c6e8">анонс плановых работ</text>
</g>
</svg>